name: CI

on:
  push:
    branches: [main, master, "feat/**", "BackEnd/First", "FrontEnd/First"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files and history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure local environment file is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must not be tracked."
            exit 1
          fi

  node-services:
    name: Node service tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: secrets
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, market-service, prediction-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/services/shared-observability/package-lock.json
            backend/services/${{ matrix.service }}/package-lock.json
      - name: Install shared observability package
        run: npm ci --prefix backend/services/shared-observability
      - name: Install and test service
        run: |
          npm ci --prefix backend/services/${{ matrix.service }}
          npm test --prefix backend/services/${{ matrix.service }}
          npm audit --prefix backend/services/${{ matrix.service }} --omit=dev --audit-level=high

  frontend:
    name: Next.js checks
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/next-app/package-lock.json
      - name: Install dependencies
        working-directory: frontend/next-app
        run: npm ci
      - name: Typecheck and production build
        working-directory: frontend/next-app
        run: |
          npm run typecheck
          npm run build
      - name: Audit production dependencies
        working-directory: frontend/next-app
        run: npm audit --omit=dev --audit-level=high

  security-service:
    name: Spring Boot security service
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/services/security-service/pom.xml
      - name: Run unit and PostgreSQL integration tests
        run: mvn -B -f backend/services/security-service/pom.xml verify

  backup:
    name: Backup service tests
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backup unit tests
        run: python -m unittest discover -s infra/backup -p "test_*.py"

  architecture:
    name: Architecture docs and Compose validation
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render and validate Mermaid diagrams
        run: python tools/validate_mermaid.py docs/architecture/diagrams.md
      - name: Validate Compose interpolation and profiles
        run: docker compose --env-file .env.example --profile backup --profile observability config --quiet

  security-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  containers:
    name: Docker image builds and Monero image tests
    runs-on: ubuntu-latest
    needs:
      - node-services
      - frontend
      - security-service
      - backup
      - architecture
      - security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Build all application services
        run: docker compose --env-file .env.example build
      - name: Build the optional backup service
        run: docker compose --env-file .env.example --profile backup build backup-service
      - name: Run Monero tests in the production image
        run: docker compose --env-file .env.example run --rm --no-deps --entrypoint python monero-api -m pytest -q tests
