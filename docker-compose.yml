services:
  monero-api:
    build:
      context: ./Monero
    environment:
      PYTHONUNBUFFERED: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    volumes:
      - monero-data:/app/data
      - monero-models:/app/models
      - monero-results:/app/results
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    depends_on:
      monero-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped

volumes:
  monero-data:
  monero-models:
  monero-results:
