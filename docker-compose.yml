services:
  monero-api:
    build:
      context: ./Monero
    environment:
      PYTHONUNBUFFERED: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      DAILY_UPDATE_UTC: "${DAILY_UPDATE_UTC:-03:15}"
      WEEKLY_RETRAIN_UTC: "${WEEKLY_RETRAIN_UTC:-04:00}"
      WEEKLY_RETRAIN_DAY_UTC: "${WEEKLY_RETRAIN_DAY_UTC:-6}"
    volumes:
      - monero-data:/app/data
      - monero-models:/app/models
      - monero-results:/app/results
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  monero-scheduler:
    image: cryptostat-project-monero-api
    command: ["python", "-m", "src.scheduler"]
    environment:
      PYTHONUNBUFFERED: "1"
      DAILY_UPDATE_UTC: "${DAILY_UPDATE_UTC:-03:15}"
      WEEKLY_RETRAIN_UTC: "${WEEKLY_RETRAIN_UTC:-04:00}"
      WEEKLY_RETRAIN_DAY_UTC: "${WEEKLY_RETRAIN_DAY_UTC:-6}"
    volumes:
      - monero-data:/app/data
      - monero-models:/app/models
      - monero-results:/app/results
    depends_on:
      monero-api:
        condition: service_healthy
    init: true
    restart: unless-stopped

  users-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${USERS_DB_NAME:-aylzz_users}"
      POSTGRES_USER: "${USERS_DB_USER:-aylzz_app}"
      POSTGRES_PASSWORD: "${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  security-service:
    build:
      context: ./backend/services/security-service
    environment:
      SERVER_PORT: "8081"
      USERS_DB_URL: "jdbc:postgresql://users-db:5432/${USERS_DB_NAME:-aylzz_users}"
      USERS_DB_USER: "${USERS_DB_USER:-aylzz_app}"
      USERS_DB_PASSWORD: "${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    expose:
      - "8081"
    depends_on:
      users-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8081/api/auth/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  api-gateway:
    build:
      context: ./backend/services/api-gateway
    environment:
      PORT: "8080"
      MONERO_API_BASE_URL: http://monero-api:8000
      SECURITY_SERVICE_BASE_URL: http://security-service:8081
    expose:
      - "8080"
    depends_on:
      monero-api:
        condition: service_healthy
      security-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "0.0.0.0:8081:80"
    restart: unless-stopped

volumes:
  monero-data:
  monero-models:
  monero-results:
  users-db-data:
