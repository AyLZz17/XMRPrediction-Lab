services:
  monero-api:
    build:
      context: ./Monero
    environment:
      PYTHONUNBUFFERED: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      DAILY_UPDATE_UTC: "${DAILY_UPDATE_UTC:-03:15}"
      WEEKLY_RETRAIN_UTC: "${WEEKLY_RETRAIN_UTC:-04:00}"
      WEEKLY_RETRAIN_DAY_UTC: "${WEEKLY_RETRAIN_DAY_UTC:-6}"
    volumes:
      - monero-data:/app/data
      - monero-models:/app/models
      - monero-results:/app/results
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  monero-scheduler:
    image: cryptostat-project-monero-api
    command: ["python", "-m", "src.scheduler"]
    environment:
      PYTHONUNBUFFERED: "1"
      DAILY_UPDATE_UTC: "${DAILY_UPDATE_UTC:-03:15}"
      WEEKLY_RETRAIN_UTC: "${WEEKLY_RETRAIN_UTC:-04:00}"
      WEEKLY_RETRAIN_DAY_UTC: "${WEEKLY_RETRAIN_DAY_UTC:-6}"
    volumes:
      - monero-data:/app/data
      - monero-models:/app/models
      - monero-results:/app/results
    depends_on:
      monero-api:
        condition: service_healthy
    init: true
    restart: unless-stopped

  users-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${USERS_DB_NAME:-aylzz_users}"
      POSTGRES_USER: "${USERS_DB_USER:-aylzz_app}"
      POSTGRES_PASSWORD: "${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}"
      USERS_DB_BACKUP_USER: "${USERS_DB_BACKUP_USER:-}"
      USERS_DB_BACKUP_PASSWORD: "${USERS_DB_BACKUP_PASSWORD:-}"
    volumes:
      - users-db-data:/var/lib/postgresql/data
      - ./infra/postgres/init-backup-user.sh:/docker-entrypoint-initdb.d/20-create-backup-user.sh:ro
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  security-service:
    build:
      context: ./backend/services/security-service
    environment:
      SERVER_PORT: "8081"
      USERS_DB_URL: "jdbc:postgresql://users-db:5432/${USERS_DB_NAME:-aylzz_users}"
      USERS_DB_USER: "${USERS_DB_USER:-aylzz_app}"
      USERS_DB_PASSWORD: "${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    expose:
      - "8081"
    depends_on:
      users-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8081/api/auth/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}"
      MONGO_INITDB_DATABASE: admin
      MONGO_MARKET_USER: "${MONGO_MARKET_USER:-market_service}"
      MONGO_MARKET_PASSWORD: "${MONGO_MARKET_PASSWORD:?Set MONGO_MARKET_PASSWORD in .env}"
      MONGO_PREDICTION_USER: "${MONGO_PREDICTION_USER:-prediction_service}"
      MONGO_PREDICTION_PASSWORD: "${MONGO_PREDICTION_PASSWORD:?Set MONGO_PREDICTION_PASSWORD in .env}"
      MONGO_MARKET_BACKUP_USER: "${MONGO_MARKET_BACKUP_USER:-}"
      MONGO_MARKET_BACKUP_PASSWORD: "${MONGO_MARKET_BACKUP_PASSWORD:-}"
      MONGO_PREDICTION_BACKUP_USER: "${MONGO_PREDICTION_BACKUP_USER:-}"
      MONGO_PREDICTION_BACKUP_PASSWORD: "${MONGO_PREDICTION_BACKUP_PASSWORD:-}"
    volumes:
      - mongodb-data:/data/db
      - ./infra/mongodb/init-users.js:/docker-entrypoint-initdb.d/10-init-users.js:ro
    ports:
      - "127.0.0.1:27018:27017"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok"
      interval: 20s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - "umask 077; printf 'user default on >%s ~* &* +@all\\n' \"$$REDIS_PASSWORD\" > /data/users.acl; exec redis-server --aclfile /data/users.acl --appendonly yes"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

  market-service:
    build:
      context: ./backend/services/market-service
    environment:
      PORT: "8090"
      MONERO_API_BASE_URL: http://monero-api:8000
      MONGO_URL: "mongodb://${MONGO_MARKET_USER:-market_service}:${MONGO_MARKET_PASSWORD:?Set MONGO_MARKET_PASSWORD in .env}@mongodb:27017/market_service?authSource=admin"
    expose:
      - "8090"
    depends_on:
      mongodb:
        condition: service_healthy
      monero-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8090/ready || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  prediction-service:
    build:
      context: ./backend/services/prediction-service
    environment:
      PORT: "8092"
      MONERO_API_BASE_URL: http://monero-api:8000
      MONGO_URL: "mongodb://${MONGO_PREDICTION_USER:-prediction_service}:${MONGO_PREDICTION_PASSWORD:?Set MONGO_PREDICTION_PASSWORD in .env}@mongodb:27017/prediction_service?authSource=admin"
    expose:
      - "8092"
    depends_on:
      mongodb:
        condition: service_healthy
      monero-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8092/ready || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api-gateway:
    build:
      context: ./backend/services/api-gateway
    environment:
      PORT: "8080"
      MONERO_API_BASE_URL: http://monero-api:8000
      SECURITY_SERVICE_BASE_URL: http://security-service:8081
      MARKET_SERVICE_BASE_URL: http://market-service:8090
      PREDICTION_SERVICE_BASE_URL: http://prediction-service:8092
      REDIS_URL: "redis://default:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0"
    expose:
      - "8080"
    depends_on:
      monero-api:
        condition: service_healthy
      security-service:
        condition: service_healthy
      market-service:
        condition: service_healthy
      prediction-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup-service:
    profiles: ["backup"]
    build:
      context: ./infra/backup
    environment:
      USERS_DB_HOST: users-db
      USERS_DB_PORT: "5432"
      USERS_DB_NAME: "${USERS_DB_NAME:-aylzz_users}"
      USERS_DB_BACKUP_USER: "${USERS_DB_BACKUP_USER:-}"
      USERS_DB_BACKUP_PASSWORD: "${USERS_DB_BACKUP_PASSWORD:-}"
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_MARKET_BACKUP_USER: "${MONGO_MARKET_BACKUP_USER:-}"
      MONGO_MARKET_BACKUP_PASSWORD: "${MONGO_MARKET_BACKUP_PASSWORD:-}"
      MONGO_PREDICTION_BACKUP_USER: "${MONGO_PREDICTION_BACKUP_USER:-}"
      MONGO_PREDICTION_BACKUP_PASSWORD: "${MONGO_PREDICTION_BACKUP_PASSWORD:-}"
      BACKUP_SMTP_HOST: "${BACKUP_SMTP_HOST:-}"
      BACKUP_SMTP_PORT: "${BACKUP_SMTP_PORT:-587}"
      BACKUP_SMTP_USERNAME: "${BACKUP_SMTP_USERNAME:-}"
      BACKUP_SMTP_PASSWORD: "${BACKUP_SMTP_PASSWORD:-}"
      BACKUP_SMTP_FROM: "${BACKUP_SMTP_FROM:-}"
      BACKUP_EMAIL_TO: "${BACKUP_EMAIL_TO:-}"
      BACKUP_AGE_RECIPIENT: "${BACKUP_AGE_RECIPIENT:-}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
      BACKUP_RETRY_SECONDS: "${BACKUP_RETRY_SECONDS:-900}"
      BACKUP_MAX_ATTACHMENT_BYTES: "${BACKUP_MAX_ATTACHMENT_BYTES:-18000000}"
    depends_on:
      users-db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: on-failure:5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "0.0.0.0:8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/login/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  monero-data:
  monero-models:
  monero-results:
  users-db-data:
  mongodb-data:
  redis-data:
