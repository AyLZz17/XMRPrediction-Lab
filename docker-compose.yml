services:
  monero-api:
    build:
      context: ./Monero
    environment:
      PYTHONUNBUFFERED: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      DAILY_UPDATE_UTC: "${DAILY_UPDATE_UTC:-03:15}"
      WEEKLY_RETRAIN_UTC: "${WEEKLY_RETRAIN_UTC:-04:00}"
      WEEKLY_RETRAIN_DAY_UTC: "${WEEKLY_RETRAIN_DAY_UTC:-6}"
    volumes:
      - monero-data:/app/data
      - monero-models:/app/models
      - monero-results:/app/results
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  monero-scheduler:
    image: cryptostat-project-monero-api
    command: ["python", "-m", "src.scheduler"]
    environment:
      PYTHONUNBUFFERED: "1"
      DAILY_UPDATE_UTC: "${DAILY_UPDATE_UTC:-03:15}"
      WEEKLY_RETRAIN_UTC: "${WEEKLY_RETRAIN_UTC:-04:00}"
      WEEKLY_RETRAIN_DAY_UTC: "${WEEKLY_RETRAIN_DAY_UTC:-6}"
    volumes:
      - monero-data:/app/data
      - monero-models:/app/models
      - monero-results:/app/results
    depends_on:
      monero-api:
        condition: service_healthy
    init: true
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend/services/api-gateway
    environment:
      PORT: "8080"
      MONERO_API_BASE_URL: http://monero-api:8000
    expose:
      - "8080"
    depends_on:
      monero-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "0.0.0.0:8081:80"
    restart: unless-stopped

volumes:
  monero-data:
  monero-models:
  monero-results:
