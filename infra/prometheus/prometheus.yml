global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: market-service
    static_configs:
      - targets: ["market-service:8090"]

  - job_name: prediction-service
    static_configs:
      - targets: ["prediction-service:8092"]

  - job_name: security-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["security-service:8081"]
